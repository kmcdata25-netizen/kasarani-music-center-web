# Netlify configuration for Kasarani Music Center landing page

[build]
  publish = "."

[[redirects]]
  from = "/download"
  to = "https://github.com/kmcdata25-netizen/kasarani-app-releases/releases/download/v1.0.6/Kasarani_Music_Center_v1.0.6_b7.apk"
  status = 302
  force = true

[[redirects]]
  from = "/app"
  to = "https://github.com/kmcdata25-netizen/kasarani-app-releases/releases/download/v1.0.6/Kasarani_Music_Center_v1.0.6_b7.apk"
  status = 302
  force = true

[[redirects]]
  from = "/apk"
  to = "https://github.com/kmcdata25-netizen/kasarani-app-releases/releases/download/v1.0.6/Kasarani_Music_Center_v1.0.6_b7.apk"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
